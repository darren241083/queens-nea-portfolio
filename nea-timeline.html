<link rel="stylesheet" href="nea-timeline.css">
<style>
  /* Page chrome only — the timeline itself is styled by nea-timeline.css */
  :root{
    color-scheme: light dark;
    --paper:#EEEFE8;
    --paper-dot:#CBCFC1;
    --surface:#FFFFFF;
    --ink:#1C1F1A;
    --ink-soft:#54584E;
    --line:#C7CABB;
    --accent:#DD5A1C;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#17191A;
      --paper-dot:#2B2E29;
      --surface:#1F2220;
      --ink:#EDEEE7;
      --ink-soft:#A9AC9F;
      --line:#383B34;
      --accent:#FF7A3D;
    }
  }
  :root[data-theme="dark"]{
    --paper:#17191A;
    --paper-dot:#2B2E29;
    --surface:#1F2220;
    --ink:#EDEEE7;
    --ink-soft:#A9AC9F;
    --line:#383B34;
    --accent:#FF7A3D;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    padding-inline:20px;
    padding-block:0 40px;
    background:
      radial-gradient(circle, var(--paper-dot) 1.3px, transparent 1.3px) 0 0/26px 26px,
      var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  }
  img{max-width:100%;}
  [hidden]{display:none !important;}
  .wrap{max-width:1320px;margin-inline:auto;}

  .skip-link{
    position:absolute; z-index:60; top:12px; left:-9999px;
    padding:12px 18px; border:1px solid #9d9d95; border-radius:3px;
    background:#ffffff; color:#111111;
    font-family:Arial,Helvetica,sans-serif;
    font-size:0.78rem; font-weight:700; letter-spacing:0.1em;
    text-decoration:none; text-transform:uppercase;
  }
  .skip-link:focus{ left:12px; }

  /* Site nav, identical to the rest of the site */
  .site-nav{
    position:sticky; z-index:50; top:0;
    margin-inline:-20px; padding-inline:20px;
    background:#f4f4f1; border-bottom:1px solid #d8d8d2;
    font-family:Arial,Helvetica,sans-serif;
  }
  .site-nav-inner{
    display:flex; width:min(1320px,100%); margin:0 auto; padding:16px 0;
    gap:12px 28px; align-items:center; justify-content:space-between; flex-wrap:wrap;
  }
  .site-nav-brand{
    color:#111111; font-size:0.78rem; font-weight:700; letter-spacing:0.14em;
    text-decoration:none; text-transform:uppercase;
  }
  .site-nav-list{
    display:flex; gap:10px 26px; margin:0; padding:0; flex-wrap:wrap; list-style:none;
  }
  .site-nav-list a{
    display:inline-block; padding-bottom:3px; border-bottom:2px solid transparent;
    color:#626660; font-size:0.72rem; font-weight:700; letter-spacing:0.12em;
    text-decoration:none; text-transform:uppercase;
    transition:color 180ms ease, border-color 180ms ease;
  }
  .site-nav-brand:hover, .site-nav-list a:hover{ color:#111111; }
  .site-nav-list a[aria-current="page"]{ border-bottom-color:#596a64; color:#111111; }
  .site-nav-brand:focus-visible, .site-nav-list a:focus-visible{
    outline:3px solid rgba(47,95,87,0.34); outline-offset:3px;
  }
  @media (max-width:760px){
    .site-nav{ position:static; }
    .site-nav-inner{ padding:12px 0; gap:8px 20px; }
  }

  /* Hero: title and one line, nothing else */
  .hero{ padding-block:34px 24px; display:flex; flex-direction:column; gap:12px; }
  .eyebrow{
    display:flex; gap:10px; align-items:center;
    color:var(--accent);
    font-family:"IBM Plex Mono", monospace;
    font-size:0.76rem; font-weight:600; letter-spacing:0.14em; text-transform:uppercase;
  }
  .eyebrow::before{ content:""; width:22px; height:2px; background:var(--accent); display:inline-block; }
  .hero h1{
    margin:0;
    font-family:"Big Shoulders Display", ui-sans-serif, sans-serif;
    font-size:clamp(2.6rem, 9vw, 4.6rem); font-weight:800;
    letter-spacing:0.01em; line-height:0.95; text-transform:uppercase;
  }
  .hero .lede{ margin:0; max-width:60ch; color:var(--ink-soft); font-size:1.05rem; line-height:1.6; }
</style>
<script src="nea-timeline.js" defer></script>
</head>
